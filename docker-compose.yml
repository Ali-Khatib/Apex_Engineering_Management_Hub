# Local development stack.
#
# No secret has a literal value here. Copy backend/.env.example to .env and
# fill it in; compose reads that file. The previous version shipped
# JWT_SECRET and GITHUB_WEBHOOK_SECRET as literals, which meant any deployment
# that forgot to override them ran on a secret published in the repository.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-apex_erp}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apex} -d ${POSTGRES_DB:-apex_erp}"]
      interval: 3s
      retries: 20

  app:
    build: .
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    env_file: [backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-apex_erp}
      APEX_ENV: ${APEX_ENV:-development}

volumes:
  pgdata: {}
